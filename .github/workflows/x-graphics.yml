# Renders the X post graphics for a shared plan from the live site and commits them to the
# branch x-graphics, under <plan>/ (also kept as a workflow artifact for 14 days).
name: X graphics

on:
  workflow_dispatch:
    inputs:
      plan:
        description: Shared plan slug (the part after /p/)
        required: true
      looks:
        description: Looks to render, space separated
        default: departures grid card
      kinds:
        description: Formats to render, space separated
        default: slate crunch cover
      link:
        description: 1 shows the site address on the image, 0 leaves it off
        default: "1"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Render
        env:
          PLAN: ${{ inputs.plan }}
          LOOKS: ${{ inputs.looks }}
          KINDS: ${{ inputs.kinds }}
          LINK: ${{ inputs.link }}
        run: |
          set -euo pipefail
          [[ "$PLAN" =~ ^[A-Za-z0-9]{4,16}$ ]] || { echo "bad plan slug"; exit 1; }
          [[ "$LINK" =~ ^[01]$ ]] || { echo "link must be 0 or 1"; exit 1; }
          mkdir out
          for look in $LOOKS; do
            for kind in $KINDS; do
              [[ "$look$kind" =~ ^[a-z]+$ ]] || continue
              curl -fsS --retry 2 -o "out/${look}-${kind}.png" \
                "https://gameday-tau-seven.vercel.app/api/og/x?plan=${PLAN}&kind=${kind}&look=${look}&link=${LINK}"
            done
          done
          ls -la out
      - name: Commit to the x-graphics branch
        env:
          PLAN: ${{ inputs.plan }}
          REPO: ${{ github.repository }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@users.noreply.github.com"
          url="https://x-access-token:${TOKEN}@github.com/${REPO}.git"
          if git clone --depth 1 --branch x-graphics "$url" store 2>/dev/null; then :; else
            mkdir store && cd store && git init -q -b x-graphics && git remote add origin "$url" && cd ..
          fi
          mkdir -p "store/$PLAN" && cp out/*.png "store/$PLAN/"
          cd store && git add -A && git commit -qm "X graphics for plan $PLAN" && git push -q origin x-graphics
      - uses: actions/upload-artifact@v4
        with:
          name: x-graphics-${{ inputs.plan }}
          path: out/
          retention-days: 14
